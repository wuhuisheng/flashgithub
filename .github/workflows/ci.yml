name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 还原依赖
        run: dotnet restore

      - name: 构建
        run: dotnet build --no-restore -c Release

      # 端到端冒烟测试：DoH 解析 → CA 签发 → 本地反代转发真实请求
      - name: 冒烟测试（真实访问 GitHub）
        run: dotnet run --no-build -c Release --project test/FlashGithub.ConsoleTest

  # 主分支推送：构建三平台产物并上传为 Actions Artifacts
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # macOS 走打包脚本（组装 .app 并生成 DMG）
      - name: macOS 打包
        if: matrix.os == 'macos-latest'
        run: bash scripts/package-macos.sh ${{ matrix.rid }} 0.0.0-dev

      # Windows / Linux：自包含单文件
      - name: 发布单文件
        if: matrix.os != 'macos-latest'
        run: >
          dotnet publish src/FlashGithub.App -c Release -r ${{ matrix.rid }}
          --self-contained true /p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: 上传构建产物（macOS DMG）
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FlashGithub-${{ matrix.rid }}.dmg
          path: dist/FlashGithub-${{ matrix.rid }}.dmg

      - name: 上传构建产物（Windows/Linux）
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FlashGithub-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

  # 打 v* 标签：三平台打包并发布 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: macOS 打包（.app + DMG）
        if: matrix.os == 'macos-latest'
        run: bash scripts/package-macos.sh ${{ matrix.rid }} ${GITHUB_REF_NAME#v}

      - name: Windows 打包（单文件 exe → zip）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          dotnet publish src/FlashGithub.App -c Release -r ${{ matrix.rid }} `
            --self-contained true /p:PublishSingleFile=true -o publish
          Compress-Archive -Path publish/FlashGithub.App.exe `
            -DestinationPath FlashGithub-win-x64.zip

      - name: Linux 打包（单文件 → tar.gz）
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet publish src/FlashGithub.App -c Release -r ${{ matrix.rid }} \
            --self-contained true /p:PublishSingleFile=true -o publish
          tar czf FlashGithub-linux-x64.tar.gz -C publish FlashGithub.App

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            FlashGithub-win-x64.zip
            FlashGithub-linux-x64.tar.gz
            dist/FlashGithub-macOS-osx-arm64.dmg
